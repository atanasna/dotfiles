unbind r
bind r source-file ~/.tmux.conf

# unbind C-n
set -g prefix Tab
bind Tab send-prefix

set -g mouse on

set -g default-terminal "${TERM}"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable extended keys (for Shift+Enter, Ctrl+Enter, etc.)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys,ghostty:extkeys'

# Set window index
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on


# No idea
set -g escape-time 0

#####################################
# Panes Shortcuts
#####################################
# Smart pane switching with awareness of Neovim splits.
bind-key -n C-h if -F "#{@pane-is-vim}" { send-keys C-h } { if -F "#{pane_at_left}"   "" "select-pane -L" }
bind-key -n C-j if -F "#{@pane-is-vim}" { send-keys C-j } { if -F "#{pane_at_bottom}" "" "select-pane -D" }
bind-key -n C-k if -F "#{@pane-is-vim}" { send-keys C-k } { if -F "#{pane_at_top}"    "" "select-pane -U" }
bind-key -n C-l if -F "#{@pane-is-vim}" { send-keys C-l } { if -F "#{pane_at_right}"  "" "select-pane -R" }

# Smart pane resizing with awareness of Neovim splits.
bind-key -n M-C-h if -F "#{@pane-is-vim}" 'send-keys M-C-h' 'resize-pane -L 3'
bind-key -n M-C-j if -F "#{@pane-is-vim}" 'send-keys M-C-j' 'resize-pane -D 3'
bind-key -n M-C-k if -F "#{@pane-is-vim}" 'send-keys M-C-k' 'resize-pane -U 3'
bind-key -n M-C-l if -F "#{@pane-is-vim}" 'send-keys M-C-l' 'resize-pane -R 3'

# Switch windows with Alt+number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

#####################################
# Panes Shortcuts
#####################################
unbind p
bind p switch-client -T pane
bind -T pane l split-window -h -c "#{pane_current_path}" \;
bind -T pane h split-window -h -c "#{pane_current_path}" \; select-pane -L
bind -T pane k split-window -v -c "#{pane_current_path}" \; select-pane -U
bind -T pane j split-window -v -c "#{pane_current_path}" \;
bind -T pane f resize-pane -Z

#####################################
# Sessions Shortcuts
#####################################
unbind s
bind s switch-client -T session
bind -T session r display-popup -h 3 -w 20% -y 8 -E 'name=$(: | fzf --print-query --prompt "Rename: " --query "$(tmux display-message -p "#S")"); [ $? -ne 130 ] && [ -n "$name" ] && tmux rename-session "$name"'
bind -T session a display-popup -h 3 -w 20% -y 8 -E 'name=$(: | fzf --print-query --prompt "Session: "); [ $? -ne 130 ] && [ -n "$name" ] && tmux new-session -d -s "$name" && tmux switch-client -t "$name"'
# bind -n M-s display-popup -h 3 -w 20% -y 8 -E 'name=$(: | fzf --print-query --prompt "Session: "); [ $? -ne 130 ] && [ -n "$name" ] && tmux new-session -d -s "$name" && tmux switch-client -t "$name"'

#####################################
# Tab Shortcuts
#####################################
unbind t
bind t switch-client -T tab
bind -T tab r display-popup -h 3 -w 20% -y 8 -E 'name=$(: | fzf --print-query --prompt "Rename: " --query "$(tmux display-message -p "#W")"); [ $? -ne 130 ] && [ -n "$name" ] && tmux rename-window "$name"'
bind -T tab d kill-window
bind -T tab a display-popup -h 3 -w 20% -y 8 -d "#{pane_current_path}" -E 'name=$(: | fzf --print-query --prompt "Tab: "); [ $? -ne 130 ] && [ -n "$name" ] && tmux new-window -a -n "$name" -c "$PWD"'
# bind -n M-t display-popup -h 3 -w 20% -y 8 -d "#{pane_current_path}" -E 'name=$(: | fzf --print-query --prompt "Tab: "); [ $? -ne 130 ] && [ -n "$name" ] && tmux new-window -a -n "$name" -c "$PWD"'

#####################################
# Find Shortcuts
#####################################
unbind f
bind f switch-client -T find
bind -T find s display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --ansi --reverse --header \"\$(printf '\\033[38;2;138;200;255m')Sessions - \$(printf '\\033[38;2;138;229;255m')$(tmux display-message -p '#S')\$(printf '\\033[0m')\" --header-first --cycle --bind \"ctrl-x:execute-silent(tmux kill-session -t {})+reload(tmux list-sessions | sed -E 's/:.*\$//' | grep -v \\\"^\$(tmux display-message -p '#S')\\\$\\\")\" | xargs -r tmux switch-client -t"

set -g allow-rename off
set -g automatic-rename off

set-option -g status-position top
set -g status-justify centre
set -g status-format[1] ""

#####################################
# Plugins
#####################################
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

# set -g @plugin 'Nucc/tmux-which-key'

# CUSTOM
set -g status-right-length 100
set -g status-left-length 100


# Window
set -g @catppuccin_window_status_style "rounded"
set -g window-status-separator " "

## Window global/default configuration
set -g @catppuccin_window_text " #{window_name}"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_last ""
set -g @catppuccin_window_flags_icon_current ""
set -g @catppuccin_window_number_position "left"

## Window current configuration
set -g @catppuccin_window_current_text " #{window_name}"

# Status modules config
# set -g @catppuccin_date_time_text "%d-%m %H:%M"

# Run plugin
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Status
set -gF  status-left "#{@catppuccin_status_session}"
set -gF  status-right "#{@catppuccin_status_directory}"
# set -agF status-right "#{@catppuccin_status_user}"
# set -agF status-right "#{@catppuccin_status_host}"
# set -agF status-right "#{E:@catppuccin_status_date_time}"

# Init the plugin-manager
run '~/.tmux/plugins/tpm/tpm'
